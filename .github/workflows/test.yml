name: testler

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Sozdizimi kontrolu
        run: |
          python3 -m py_compile app.py parola-hash.py
          bash -n kur.sh test/test_http.sh

      - name: Panel mantik testleri (ornek-data.json)
        run: node test/test_mantik.js

      - name: HTTP davranis testleri
        run: bash test/test_http.sh
