# Personel Paneli — nginx ornegi
#
# Panel alt yol olarak yayinlanir:  https://panel.ornek.com/personel/
# (Kok dizinden yayinlamak isterseniz ikinci blogu kullanin.)
#
# Once sertifika:  certbot --nginx -d panel.ornek.com

server {
    listen 443 ssl http2;
    server_name panel.ornek.com;

    ssl_certificate     /etc/letsencrypt/live/panel.ornek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.ornek.com/privkey.pem;

    # Kisa adres -> sonundaki egik cizgiye yonlendir (goreli baglantilar bozulmasin)
    location = /personel {
        return 301 /personel/;
    }

    location ^~ /personel/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        client_max_body_size 12m;   # panel 8 MB ustu govdeyi zaten reddeder
    }
}

